# Fail2Ban configuration file
#
# Records bans to a plain CSV file so they can be restored on the next
# fail2ban start. Exists because Smoothwall Express's bundled Python 2.7
# has no _sqlite3 extension module, so fail2ban's normal SQLite-backed ban
# database (dbfile in fail2ban.conf) can never persist bans across a
# restart on this platform - see README.
#
# Restoration itself happens in bin/rc.fail2ban (start()), which reads
# this file after the server comes up and re-bans any entry that hasn't
# expired yet via `fail2ban-client set <jail> banip <ip>`, dropping expired
# rows from the CSV as it goes.
#
# actionunban deliberately does NOT remove the CSV row. fail2ban calls
# actionunban for every currently-banned ticket whenever a jail *stops*
# (Actions.run()'s cleanup flushes the live ban list on thread exit), not
# only for a real admin-initiated unban - so a CSV-stripping actionunban
# would erase every entry on every single `rc.fail2ban stop`, before
# restore_bans() ever got a chance to read it back on the next start. The
# tradeoff: an IP unbanned early by an admin (before its bantime is up)
# will still get re-banned by the following restart. Expiry-based pruning
# in restore_bans() is what actually keeps this file from growing forever.

[Definition]

csvfile = /var/smoothwall/mods-available/fail2ban/var/lib/fail2ban/bans.csv

actionstart = touch <csvfile>

actionban = echo '<ip>,<name>,<bantime>,<time>' >> <csvfile>

[Init]
