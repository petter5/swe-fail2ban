# Fail2Ban configuration file
#
# Records bans to a plain CSV file so they can be restored on the next
# fail2ban start. Exists because Smoothwall Express's bundled Python 2.7
# has no _sqlite3 extension module, so fail2ban's normal SQLite-backed ban
# database (dbfile in fail2ban.conf) can never persist bans across a
# restart on this platform - see README.
#
# Restoration itself happens in bin/rc.fail2ban (start()), which reads
# this file after the server comes up and re-bans any entry that hasn't
# expired yet via `fail2ban-client set <jail> banip <ip>`.

[Definition]

csvfile = /var/smoothwall/mods-available/fail2ban/var/lib/fail2ban/bans.csv

actionstart = touch <csvfile>

actionban = echo '<ip>,<name>,<bantime>,<time>' >> <csvfile>

actionunban = grep -vF '<ip>,<name>,' <csvfile> > <csvfile>.tmp 2>/dev/null; mv <csvfile>.tmp <csvfile>

[Init]
